<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hishatak Field</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f5f6f4;color:#17372d}.top{background:#0e2a20;color:white;padding:22px 18px}.top h1{margin:0;color:#d8c58a;font-family:serif}.top p{margin:4px 0 0}.nav{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:2}.nav button{flex:1;padding:13px 4px;border:0;background:#fff;font-size:13px}.nav button.active{color:#0e6b50;border-bottom:3px solid #0e6b50}.page{display:none;padding:16px}.page.active{display:block}.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0001}input,textarea,button,select{box-sizing:border-box}input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #cfd7d2;border-radius:9px;font-size:16px}button.primary{width:100%;padding:13px;background:#0e6b50;color:#fff;border:0;border-radius:9px;font-size:16px;margin:6px 0}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#68756f;font-size:13px}.ok{color:#087b52}.photo{width:100%;max-height:260px;object-fit:contain;border-radius:9px;background:#eee}.record{border-bottom:1px solid #eee;padding:10px 0;cursor:pointer}.record:active{background:#f1f5f2}.detail{position:fixed;inset:0;background:#f5f6f4;z-index:10;overflow:auto;padding:18px;display:none}.detail.open{display:block}.detail .card{max-width:700px;margin:20px auto}.secondary{width:100%;padding:12px;background:#fff;color:#0e6b50;border:1px solid #0e6b50;border-radius:9px;font-size:16px;margin:6px 0}.danger{color:#a22;border-color:#a22}.badge{display:inline-block;background:#e8f3ee;padding:4px 8px;border-radius:12px;font-size:12px}</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script></head><body>
<div class="top"><h1>Hishatak</h1><p>Field · Полевой сбор данных</p></div>
<div class="nav"><button data-p="records" class="active">Записи</button><button data-p="add">Добавить</button><button data-p="search">Поиск</button><button data-p="export">Экспорт</button></div>
<section id="records" class="page active"><div class="card"><b>Всего записей: <span id="count">0</span></b><p class="muted">Данные хранятся локально на этом устройстве.</p><div id="list"></div></div></section>
<section id="add" class="page"><div class="card"><h3>Новая запись</h3><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="photo" style="display:none"><div class="row"><select id="ocrLang"><option value="rus">Русский</option><option value="hye">Հայերեն</option><option value="eng">English</option><option value="rus+hye+eng">Авто / смешанный</option></select><select id="ocrMode"><option value="single">Один человек</option><option value="family">Семейный памятник</option></select></div><button class="primary" id="aiOcr">Точное AI-распознавание</button><button class="primary" id="ocr">Локальный OCR (резерв)</button><div id="ocrStatus" class="muted">OCR: готов</div><textarea id="raw" rows="4" placeholder="Распознанный текст"></textarea></div>
<div class="card"><div class="row"><input id="last" placeholder="Фамилия"><input id="first" placeholder="Имя"></div><input id="middle" placeholder="Отчество"><div class="row"><input id="birth" type="date"><input id="death" type="date"></div><input id="cem" placeholder="Кладбище"><textarea id="notes" placeholder="Примечание"></textarea></div>
<div class="card"><button class="primary" id="gps">Получить GPS</button><div id="gpsText" class="muted">GPS не получены</div><button class="primary" id="save">Сохранить запись</button></div></section>
<section id="search" class="page"><div class="card"><div class="row"><input id="q" placeholder="ФИО или кладбище"><button class="primary" id="searchBtn" style="flex:0 0 110px">Поиск</button></div><div id="searchList"></div></div></section>
<section id="export" class="page"><div class="card"><button class="primary" id="exportJson">Экспорт JSON</button><button class="primary" id="exportCsv">Экспорт CSV</button><button class="primary" id="exportExcel">Экспорт Excel</button><p class="muted">Резервная копия сохраняется в файл.</p></div></section>
<div id="detail" class="detail"><div class="card"><button class="secondary" onclick="closeDetail()">← Назад</button><div id="detailBody"></div><button class="secondary danger" id="deleteRecord">Удалить запись</button></div></div>
<script>
const $=id=>document.getElementById(id); let imageData='',gps=null,aiPeople=[];
function data(){try{return JSON.parse(localStorage.getItem('hishatak_records')||'[]')}catch(e){return[]}}
function put(a){localStorage.setItem('hishatak_records',JSON.stringify(a))}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));if(p==='records')render();if(p==='search')search()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));
function render(){let a=data();$('count').textContent=a.length;$('list').innerHTML=a.slice().reverse().map(r=>'<div class="record" onclick="openDetail('+r.id+')"><b>'+esc([r.last,r.first,r.middle].filter(Boolean).join(' '))+'</b><br><span class="muted">'+esc(r.birth||'')+' — '+esc(r.death||'')+' · '+esc(r.cem||'')+'</span><br><span class="badge">'+(r.lat?'GPS ✓':'GPS —')+'</span></div>').join('')||'<p class="muted">Записей пока нет.</p>'}
let detailId=null;function familyOf(r,a){return a.filter(x=>x.id!==r.id&&((r.familyId&&x.familyId===r.familyId)||(r.lat&&x.lat&&Math.abs(x.lat-r.lat)<0.00003&&Math.abs(x.lon-r.lon)<0.00003)))}function openDetail(id){let a=data(),r=a.find(x=>x.id===id);if(!r)return;detailId=id;let fam=familyOf(r,a);$('detailBody').innerHTML='<h2>'+esc([r.last,r.first,r.middle].filter(Boolean).join(' '))+'</h2><p><b>Дата рождения:</b> '+esc(r.birth||'—')+'<br><b>Дата смерти:</b> '+esc(r.death||'—')+'<br><b>Кладбище:</b> '+esc(r.cem||'—')+'<br><b>GPS:</b> '+(r.lat?esc(r.lat+', '+r.lon):'—')+'</p><p><b>Примечание:</b><br>'+esc(r.notes||'—').replace(/\\n/g,'<br>')+'</p>'+(fam.length?'<h3>Люди у этого памятника</h3>'+fam.map(x=>'<div class="record" onclick="openDetail('+x.id+')"><b>'+esc([x.last,x.first,x.middle].filter(Boolean).join(' '))+'</b><br><span class="muted">'+esc(x.birth||'')+' — '+esc(x.death||'')+'</span></div>').join(''):'');$('detail').classList.add('open')}function closeDetail(){$('detail').classList.remove('open');detailId=null}$('deleteRecord').onclick=()=>{if(detailId==null)return;if(confirm('Удалить эту запись?')){put(data().filter(x=>x.id!==detailId));closeDetail();render()}}
$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{imageData=rd.result;$('preview').src=imageData;$('preview').style.display='block';$('ocrStatus').textContent='Фото готово к OCR'};rd.readAsDataURL(f)}
function normDate(y,m,d){if(!y)return''; if(m&&d)return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');return y+'-01-01'}
function cleanOCR(t,lang){
  let s=t.replace(/[|]/g,'I').replace(/[‐‑–—]/g,'-').replace(/\r/g,'');
  s=s.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
  if(lang==='rus') s=s.split('\n').map(x=>x.replace(/[^А-Яа-яЁё0-9.\-\s]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
  return s
}
function normName(x){return x.toLowerCase().replace(/(^|\s)[а-яё]/g,m=>m.toUpperCase())}
function parseText(t){
  let dateRe=/(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{4})/g, ds=[...t.matchAll(dateRe)];
  if(ds[0]) $('birth').value=normDate(ds[0][3],ds[0][2],ds[0][1]);
  if(ds[1]) $('death').value=normDate(ds[1][3],ds[1][2],ds[1][1]);
  let lines=t.split('\n').map(x=>x.replace(dateRe,'').trim()).filter(x=>x.length>2 && /[А-Яа-яЁёԱ-Ֆա-ֆA-Za-z]/.test(x));
  let words=lines.join(' ').split(/\s+/).filter(w=>w.length>2 && /^[А-Яа-яЁё-]+$/.test(w));
  let bad=/^(память|вечная|любим|родн|скорб|помним)$/i; words=words.filter(w=>!bad.test(w));
  if(words.length>=3){
    $('last').value=normName(words[0]); $('first').value=normName(words[1]); $('middle').value=normName(words[2]);
  } else if(lines.length>=3){
    $('last').value=normName(lines[0]); $('first').value=normName(lines[1]); $('middle').value=normName(lines[2]);
  }
}
async function makeVariants(src){return new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{let max=1800,scale=Math.min(2.2,max/im.width),w=Math.round(im.width*scale),h=Math.round(im.height*scale),out=[src];[0,18,-12].forEach(k=>{let cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d');x.filter='grayscale(1) contrast('+(k===0?1.7:k>0?2.15:1.35)+') brightness('+(k>0?1.08:1)+')';x.drawImage(im,0,0,w,h);out.push(cv.toDataURL('image/jpeg',0.94))});resolve(out)};im.onerror=reject;im.src=src})}
const AI_URL='https://hishatak-ai-gateway-production.up.railway.app/api/ai/recognize';
function aiDate(v){if(!v)return'';let m=String(v).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:''}
$('aiOcr').onclick=async()=>{if(!imageData){alert('Сначала сделайте фото');return}try{$('ocrStatus').textContent='AI: точное распознавание…';let r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imageData})});let d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));let people=Array.isArray(d.people)?d.people:[];aiPeople=people;$('raw').value=d.rawText||people.map(p=>p.rawText||'').filter(Boolean).join('\n\n');if(people.length){let p=people[0];$('last').value=p.lastName||'';$('first').value=p.firstName||'';$('middle').value=p.patronymic||'';$('birth').value=aiDate(p.birthDate);$('death').value=aiDate(p.deathDate)}if(people.length>1){$('notes').value='Семейный памятник: AI обнаружил '+people.length+' человек.\n'+people.slice(1).map((p,i)=>(i+2)+'. '+[p.lastName,p.firstName,p.patronymic].filter(Boolean).join(' ')+' '+(p.birthDate||'')+' — '+(p.deathDate||'')).join('\n')}$('ocrStatus').textContent='✓ AI завершён. Обнаружено людей: '+people.length+'. Проверьте данные перед сохранением.'}catch(e){$('ocrStatus').textContent='AI недоступен: '+e.message+'. Используйте локальный OCR.'}}
$('ocr').onclick=async()=>{if(!imageData){alert('Сначала сделайте фото');return}if(!window.Tesseract){$('ocrStatus').textContent='OCR-модуль не загрузился. Проверьте интернет.';return}try{$('ocrStatus').textContent='OCR: загрузка языков…';let lang=$('ocrLang').value;let variants=await makeVariants(imageData);let best=null;for(let i=0;i<variants.length;i++){$('ocrStatus').textContent='OCR: вариант '+(i+1)+'/'+variants.length;let rr=await Tesseract.recognize(variants[i],lang,{logger:m=>{if(m.progress!=null)$('ocrStatus').textContent='OCR '+(i+1)+'/'+variants.length+': '+Math.round(m.progress*100)+'%'}});if(!best||rr.data.confidence>best.data.confidence)best=rr}let r=best;let txt=cleanOCR(r.data.text,lang);$('raw').value=txt;if($('ocrMode').value==='single')parseText(txt);else $('ocrStatus').textContent='Семейный памятник: создайте отдельную запись для каждого человека.';if($('ocrMode').value==='single')$('ocrStatus').textContent='OCR завершён ('+Math.round(r.data.confidence||0)+'%). Выбран лучший из '+variants.length+' вариантов.'}catch(e){$('ocrStatus').textContent='Ошибка OCR: '+e.message}}
$('gps').onclick=()=>{if(!navigator.geolocation){$('gpsText').textContent='GPS недоступен';return}$('gpsText').textContent='Получение GPS…';navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};$('gpsText').textContent='✓ GPS получены (точность: '+Math.round(gps.acc)+' м)'},e=>$('gpsText').textContent='Ошибка GPS: '+e.message,{enableHighAccuracy:true,timeout:15000})}
$('save').onclick=()=>{let a=data(),now=Date.now(),family=$('ocrMode').value==='family'&&aiPeople.length>1,familyId=family?'family-'+now:null,base={cem:$('cem').value.trim(),lat:gps&&gps.lat,lon:gps&&gps.lon,acc:gps&&gps.acc,ocr:$('raw').value,created:new Date().toISOString(),familyId};if(family){aiPeople.forEach((p,i)=>a.push({...base,id:now+i,last:p.lastName||'',first:p.firstName||'',middle:p.patronymic||'',birth:aiDate(p.birthDate),death:aiDate(p.deathDate),notes:i===0?$('notes').value.trim():''}));}else{a.push({...base,id:now,last:$('last').value.trim(),first:$('first').value.trim(),middle:$('middle').value.trim(),birth:$('birth').value,death:$('death').value,notes:$('notes').value.trim()});}put(a);alert(family?'Сохранено записей: '+aiPeople.length:'Запись сохранена на телефоне');['last','first','middle','birth','death','cem','notes','raw'].forEach(x=>$(x).value='');$('photo').value='';$('preview').style.display='none';imageData='';aiPeople=[];gps=null;$('gpsText').textContent='GPS не получены';show('records')}
function search(){let q=$('q').value.trim().toLowerCase(),a=data(),hits=[];a.forEach(r=>{if(!q||JSON.stringify(r).toLowerCase().includes(q))hits.push({r:r,label:[r.last,r.first,r.middle].filter(Boolean).join(' ')});let note=String(r.notes||'');note.split(/\\n/).forEach(line=>{if(q&&line.toLowerCase().includes(q))hits.push({r:r,label:line.replace(/^\\s*\\d+[.)]\\s*/,''),family:true})})});$('searchList').innerHTML=hits.reverse().map(h=>'<div class="record" onclick="openDetail('+h.r.id+')"><b>'+esc(h.label||[h.r.last,h.r.first,h.r.middle].filter(Boolean).join(' '))+'</b>'+(h.family?'<br><span class="badge">Семейный памятник</span>':'')+'<br><span class="muted">'+esc(h.r.cem||'')+'</span></div>').join('')||'<p class="muted">Ничего не найдено.</p>'}
$('q').oninput=search;$('searchBtn').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};
function dl(name,text,type){if(window.Android&&Android.saveFile){Android.saveFile(name,text,type);return}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
$('exportJson').onclick=()=>dl('hishatak-backup.json',JSON.stringify(data(),null,2),'application/json');
$('exportCsv').onclick=()=>{let rows=[['Фамилия','Имя','Отчество','Дата рождения','Дата смерти','Кладбище','Широта','Долгота','Примечание'],...data().map(r=>[r.last,r.first,r.middle,r.birth,r.death,r.cem,r.lat||'',r.lon||'',r.notes])];dl('hishatak.csv',rows.map(x=>x.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')};$('exportExcel').onclick=()=>{let rows=[['ID','Фамилия','Имя','Отчество','Дата рождения','Дата смерти','Кладбище','Широта','Долгота','Точность GPS, м','Примечание','Распознанный текст','Дата создания'],...data().map(r=>[r.id,r.last,r.first,r.middle,r.birth,r.death,r.cem,r.lat||'',r.lon||'',r.acc||'',r.notes,r.ocr,r.created])];let xml='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Захоронения"><Table>'+rows.map(row=>'<Row>'+row.map(v=>'<Cell><Data ss:Type="String">'+esc(v)+'</Data></Cell>').join('')+'</Row>').join('')+'</Table></Worksheet></Workbook>';dl('hishatak-excel.xls',xml,'application/vnd.ms-excel')};render();
</script></body></html>
